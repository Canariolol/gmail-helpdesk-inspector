[project]
name = "gmail-helpdesk-ai-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.3.0",
  "respx>=0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
