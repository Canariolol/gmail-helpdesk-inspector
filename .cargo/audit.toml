# Configuración de cargo-audit para CI y ejecución desde la raíz del repo.
[advisories]
ignore = [
  # Cargo.lock conserva sqlx-mysql opcional, aunque sqlx tiene sólo postgres
  # y default-features=false. RSA no se compila en ningún target después de
  # retirar jsonwebtoken sin uso. Evidencia: cargo tree --manifest-path
  # apps/api/Cargo.toml --invert rsa --target all --prefix none no imprime árbol.
  # CI debe comprobar ese árbol vacío; retirar esta excepción si RSA se activa.
  # No existe fix para RUSTSEC-2023-0071 al 2026-10-04.
  "RUSTSEC-2023-0071",
]
