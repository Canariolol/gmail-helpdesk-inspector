services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./secrets:/run/secrets:ro
      - ./secrets:/secrets:ro
    depends_on:
      - ai-worker

  ai-worker:
    build:
      context: .
      dockerfile: apps/ai-worker/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8090:8090"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-http://localhost:8080}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
