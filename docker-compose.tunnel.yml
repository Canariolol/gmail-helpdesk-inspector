services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
      - api
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      - caddy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:?set CLOUDFLARED_TUNNEL_TOKEN}
