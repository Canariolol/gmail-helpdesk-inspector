name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: apps/ai-worker/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: ./scripts/check-all.sh
      - name: Rust dependency audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file apps/api/Cargo.lock
      - name: Python dependency audit
        run: |
          uv export --directory apps/ai-worker --frozen --no-emit-project --format requirements-txt -o /tmp/ai-worker-requirements.txt
          uvx pip-audit --requirement /tmp/ai-worker-requirements.txt --disable-pip

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production-deploy
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: gmail-helpdesk-inspector
      SKIP_CHECKS: "1"
      VITE_MERCADOPAGO_PUBLIC_KEY: ${{ vars.VITE_MERCADOPAGO_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      # Sin llaves: el pool solo acepta tokens OIDC de este repo en refs/heads/main.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/715291187926/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@gmail-helpdesk-inspector.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      # ponytail: despliega los tres servicios en cada push; filtrar por paths si el build se vuelve lento.
      - run: ./scripts/redeploy-gcp.sh all
